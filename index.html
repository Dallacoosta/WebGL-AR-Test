<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<title>AR Hiro Cube Test</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
  }

  a-scene{
    position:fixed !important;
    top:0;
    left:0;
    width:100%;
    height:100%;
  }

  #ui{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:10;
    pointer-events:none;
  }

  #status{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:#00ffff;
    padding:10px 16px;
    border:1px solid #00ffff;
    font-size:14px;
    letter-spacing:2px;
    white-space:nowrap;
  }

  #controls{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    pointer-events:auto;
  }

  button{
    background:rgba(0,0,0,0.75);
    color:white;
    border:1px solid #00ffff;
    padding:12px 18px;
    font-size:14px;
    cursor:pointer;
    min-width:140px;
  }

  button:active{
    transform:scale(0.97);
  }

  #info{
    position:absolute;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:white;
    padding:8px 12px;
    font-size:12px;
    text-align:center;
    line-height:1.5;
    max-width:320px;
  }
</style>
</head>

<body>

<div id="ui">

  <div id="status">
    SEARCHING FOR HIRO MARKER
  </div>

  <div id="info">
    Open the official Hiro marker on another screen or print it.
  </div>

  <div id="controls">
    <button id="switch-camera">
      SWITCH CAMERA
    </button>
  </div>

</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker
    id="marker"
    preset="hiro">

    <a-box
      id="cube"
      position="0 0.5 0"
      rotation="0 0 0"
      width="1"
      height="1"
      depth="1"
      color="#ff0000">
    </a-box>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>

const statusEl = document.getElementById("status");
const cube = document.getElementById("cube");
const marker = document.getElementById("marker");
const switchBtn = document.getElementById("switch-camera");

let rotation = 0;

function animateCube(){

  rotation += 1;

  cube.setAttribute(
    "rotation",
    `${rotation * 0.5} ${rotation} ${rotation * 0.25}`
  );

  requestAnimationFrame(animateCube);
}

animateCube();

marker.addEventListener("markerFound", () => {

  console.log("MARKER FOUND");

  statusEl.innerHTML = "MARKER FOUND ✓";
  statusEl.style.color = "#00ff88";
  statusEl.style.borderColor = "#00ff88";

});

marker.addEventListener("markerLost", () => {

  console.log("MARKER LOST");

  statusEl.innerHTML = "SEARCHING FOR HIRO MARKER";
  statusEl.style.color = "#00ffff";
  statusEl.style.borderColor = "#00ffff";

});

let videoDevices = [];
let currentCameraIndex = 0;

async function setupCameraList(){

  try{

    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    const devices = await navigator.mediaDevices.enumerateDevices();

    videoDevices = devices.filter(
      device => device.kind === "videoinput"
    );

    console.log("VIDEO DEVICES:", videoDevices);

  }catch(err){

    console.error(err);

  }
}

async function switchCamera(){

  if(videoDevices.length <= 1){

    alert("Only one camera found.");
    return;
  }

  currentCameraIndex++;

  if(currentCameraIndex >= videoDevices.length){
    currentCameraIndex = 0;
  }

  const selectedDevice = videoDevices[currentCameraIndex];

  console.log("SWITCHING TO:", selectedDevice.label);

  const scene = document.querySelector("a-scene");

  if(scene && scene.systems["arjs"]){

    const arSystem = scene.systems["arjs"];

    if(arSystem.arToolkitSource){

      arSystem.arToolkitSource.stop();

    }
  }

  setTimeout(() => {

    const currentVideo = document.querySelector("video");

    if(currentVideo && currentVideo.srcObject){

      currentVideo.srcObject.getTracks().forEach(track => {
        track.stop();
      });

    }

    navigator.mediaDevices.getUserMedia({

      video:{
        deviceId:{
          exact:selectedDevice.deviceId
        },
        width:{ ideal:1280 },
        height:{ ideal:720 }
      },
      audio:false

    })
    .then(stream => {

      const video = document.querySelector("video");

      if(video){

        video.srcObject = stream;

        video.play();

      }

    })
    .catch(err => {

      console.error(err);

    });

  },500);

}

switchBtn.addEventListener("click", switchCamera);

setupCameraList();

</script>

</body>
</html>
