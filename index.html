<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>CFD AR – Cube Test</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New', monospace; }

  video {
    position:fixed !important;
    top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) !important;
    min-width:100vw !important; min-height:100vh !important;
    width:auto !important; height:auto !important;
    z-index:0 !important;
  }
  canvas {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
    z-index:1 !important;
  }
  a-scene {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
  }

  /* Landing */
  #landing {
    position:fixed; inset:0; z-index:999;
    background:#030a14;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition:opacity 0.4s;
  }
  #landing.hidden { opacity:0; pointer-events:none; }
  #landing h1 { color:#00c8ff; font-size:2rem; letter-spacing:4px; }
  #landing p  { color:rgba(255,255,255,0.45); font-size:11px; letter-spacing:2px;
                text-align:center; max-width:300px; line-height:1.8; }
  #landing small { color:rgba(0,200,255,0.5); font-size:9px; letter-spacing:2px; text-align:center; max-width:280px; }
  #btn-launch {
    background:transparent; border:1px solid #00c8ff; color:#00c8ff;
    font-family:inherit; font-size:11px; letter-spacing:3px;
    padding:14px 40px; cursor:pointer; text-transform:uppercase; margin-top:8px;
  }
  #btn-launch:hover { background:#00c8ff; color:#000; }

  /* Hiro marker — pixel-perfect SVG, no fetch */
  #hiro-svg { width:180px; height:180px; border:3px solid rgba(0,200,255,0.4); }

  /* HUD */
  #hud { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0; transition:opacity 0.4s; }
  #hud.visible { opacity:1; }
  #status {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); border:1px solid rgba(0,200,255,0.3);
    color:#00c8ff; font-size:9px; letter-spacing:3px; padding:6px 16px; white-space:nowrap;
  }
  #status.found { color:#00ff88; border-color:rgba(0,255,136,0.4); }

  /* Debug panel */
  #debug {
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); color:#ff0; font-size:9px; letter-spacing:1px;
    padding:6px 12px; text-align:center; line-height:1.8; white-space:nowrap;
    border:1px solid rgba(255,200,0,0.3);
  }

  #playbar {
    position:absolute; bottom:0; left:0; right:0; padding:16px 24px 36px;
    background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
    pointer-events:all; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #step-info { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.5); }
  #scrubber {
    width:100%; max-width:400px; -webkit-appearance:none;
    height:3px; background:rgba(255,255,255,0.15); outline:none; cursor:pointer;
  }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#00c8ff; border:2px solid #000; box-shadow:0 0 8px rgba(0,200,255,0.7);
  }
  #btn-row { display:flex; gap:10px; }
  .pb-btn {
    background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-family:inherit; font-size:9px; letter-spacing:2px;
    padding:8px 20px; cursor:pointer; text-transform:uppercase;
  }
  .pb-btn:hover  { border-color:#00c8ff; color:#00c8ff; }
  .pb-btn.active { border-color:#00c8ff; color:#00c8ff; background:rgba(0,200,255,0.1); }
</style>
</head>
<body>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; logarithmicDepthBuffer: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false">

  <a-marker preset="hiro" id="marker" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-box id="cube"
      position="0 0.5 0"
      width="1" height="1" depth="1"
      color="#ff0000"
      opacity="1">
    </a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- Landing -->
<div id="landing">
  <h1>AR · CUBE TEST</h1>
  <p>Point your camera at the Hiro marker.<br/>A red cube will appear on it.</p>

  <!-- Pixel-perfect Hiro marker as inline SVG -->
  <!-- Source: official AR.js Hiro pattern, redrawn as SVG -->
  <svg id="hiro-svg" viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <rect width="10" height="10" fill="black"/>
    <rect x="1" y="1" width="8" height="8" fill="white"/>
    <!-- Hiro inner pattern (exact pixel grid from official pattern file) -->
    <rect x="2" y="2" width="1" height="1" fill="black"/>
    <rect x="4" y="2" width="2" height="1" fill="black"/>
    <rect x="7" y="2" width="1" height="1" fill="black"/>
    <rect x="2" y="3" width="1" height="1" fill="black"/>
    <rect x="4" y="3" width="1" height="1" fill="black"/>
    <rect x="6" y="3" width="1" height="1" fill="black"/>
    <rect x="2" y="4" width="3" height="1" fill="black"/>
    <rect x="6" y="4" width="2" height="1" fill="black"/>
    <rect x="2" y="5" width="1" height="1" fill="black"/>
    <rect x="4" y="5" width="1" height="1" fill="black"/>
    <rect x="6" y="5" width="1" height="1" fill="black"/>
    <rect x="2" y="6" width="1" height="1" fill="black"/>
    <rect x="4" y="6" width="2" height="1" fill="black"/>
    <rect x="7" y="6" width="1" height="1" fill="black"/>
    <rect x="2" y="7" width="6" height="1" fill="black"/>
  </svg>

  <small>
    ⚠ This is an approximation — for best results open the<br/>
    official marker on another screen:<br/>
    tinyurl.com/hiro-marker
  </small>
  <button id="btn-launch">Open Camera</button>
</div>

<div id="hud">
  <div id="status">SEARCHING FOR MARKER</div>
  <div id="debug" id="debug">camera: waiting...</div>
  <div id="playbar">
    <div id="step-info">STEP 1 / 10</div>
    <input type="range" id="scrubber" min="0" max="9" value="0" step="1"/>
    <div id="btn-row">
      <button class="pb-btn" id="btn-prev">◀◀</button>
      <button class="pb-btn" id="btn-play">▶ PLAY</button>
      <button class="pb-btn" id="btn-next">▶▶</button>
    </div>
  </div>
</div>

<script>
// ── Camera selection — pick widest lens by trying each device ───────
async function startWidestCamera() {
  // 1. Get list of all video input devices
  let devices = [];
  try {
    await navigator.mediaDevices.getUserMedia({ video: true }); // trigger permission
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'videoinput');
    dbg(`Found ${devices.length} camera(s)`);
  } catch(e) {
    dbg('enum error: ' + e.message);
    return null;
  }

  // 2. Try each rear camera and pick the one with widest FOV
  //    (widest FOV = lowest focal length = first physical lens index)
  //    We identify rear cameras by label containing "back" or "environment"
  //    and try them in order, returning the stream with lowest zoom capability
  let bestStream = null;
  let bestZoomMin = Infinity;

  for (const device of devices) {
    const label = (device.label || '').toLowerCase();
    const isRear = label.includes('back') || label.includes('rear') ||
                   label.includes('environment') || label.includes('0');
    if (!isRear && devices.length > 1) continue;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          deviceId: { exact: device.deviceId },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      const track = stream.getVideoTracks()[0];
      const caps  = track.getCapabilities ? track.getCapabilities() : {};
      const zmin  = caps.zoom ? caps.zoom.min : 1;
      dbg(`cam "${device.label.slice(0,20)}" zoomMin=${zmin}`);

      if (zmin < bestZoomMin) {
        if (bestStream) bestStream.getTracks().forEach(t=>t.stop());
        bestStream  = stream;
        bestZoomMin = zmin;
        // Apply minimum zoom
        if (caps.zoom) {
          track.applyConstraints({ advanced:[{ zoom: caps.zoom.min }] }).catch(()=>{});
        }
      } else {
        stream.getTracks().forEach(t=>t.stop());
      }
    } catch(e) {
      dbg(`skip cam: ${e.message.slice(0,30)}`);
    }
  }

  return bestStream;
}

// Intercept getUserMedia so AR.js uses our chosen stream
let _chosenStream = null;
const _gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = async function(constraints) {
  if (constraints && constraints.video) {
    if (_chosenStream) return _chosenStream;
    // fallback: just request environment facing at max res
    return _gum({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
  }
  return _gum(constraints);
};

// ── Debug helper ────────────────────────────────────────────────────
const debugEl = document.getElementById('debug');
function dbg(msg) {
  console.log(msg);
  debugEl.innerHTML = msg;
}

// ── Playback ────────────────────────────────────────────────────────
const TOTAL  = 10;
const COLORS = ['#ff0000','#ff4444','#44ff88','#ffaa00','#ff44ff',
                 '#ffff44','#44aaff','#ff8844','#88ff44','#ff4488'];
let current=0, playing=false, timer=null;
const cube=document.getElementById('cube');
const statusEl=document.getElementById('status');
const stepInfo=document.getElementById('step-info');
const scrubber=document.getElementById('scrubber');
const btnPlay=document.getElementById('btn-play');

function showStep(idx) {
  current=Math.max(0,Math.min(TOTAL-1,idx));
  const angle=(current/TOTAL)*360;
  cube.setAttribute('rotation',`${angle*0.5} ${angle} ${angle*0.3}`);
  cube.setAttribute('color',COLORS[current]);
  scrubber.value=current;
  stepInfo.textContent=`STEP ${current+1}/${TOTAL} — ${Math.round(angle)}°`;
}
function startPlay(){playing=true;btnPlay.textContent='⏸ PAUSE';btnPlay.classList.add('active');tick();}
function stopPlay(){playing=false;btnPlay.textContent='▶ PLAY';btnPlay.classList.remove('active');clearTimeout(timer);}
function tick(){timer=setTimeout(()=>{showStep((current+1)%TOTAL);if(playing)tick();},400);}
btnPlay.addEventListener('click',()=>playing?stopPlay():startPlay());
document.getElementById('btn-prev').addEventListener('click',()=>{stopPlay();showStep(current-1);});
document.getElementById('btn-next').addEventListener('click',()=>{stopPlay();showStep(current+1);});
scrubber.addEventListener('input',()=>{stopPlay();showStep(+scrubber.value);});

// ── Fix sizing ──────────────────────────────────────────────────────
function fixSizing() {
  document.querySelectorAll('video').forEach(v=>{
    v.style.position='fixed'; v.style.top='50%'; v.style.left='50%';
    v.style.transform='translate(-50%,-50%)';
    v.style.minWidth='100vw'; v.style.minHeight='100vh';
    v.style.width='auto'; v.style.height='auto'; v.style.zIndex='0';
    // Log actual video size to debug
    dbg(`video: ${v.videoWidth}×${v.videoHeight} | screen: ${window.innerWidth}×${window.innerHeight}`);
  });
  document.querySelectorAll('canvas').forEach(c=>{
    c.style.position='fixed'; c.style.top='0'; c.style.left='0';
    c.style.width='100vw'; c.style.height='100vh'; c.style.zIndex='1';
  });
  const sc=document.querySelector('a-scene');
  if(sc&&sc.renderer) sc.renderer.setSize(window.innerWidth,window.innerHeight);
}
window.addEventListener('resize',fixSizing);

// ── Launch ──────────────────────────────────────────────────────────
document.getElementById('btn-launch').addEventListener('click', async ()=>{
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('hud').classList.add('visible');
  showStep(0);
  dbg('selecting camera...');

  // Try to pick widest camera before AR.js starts
  _chosenStream = await startWidestCamera();
  dbg(_chosenStream ? 'wide camera ready' : 'using fallback camera');

  setTimeout(fixSizing,800);
  setTimeout(fixSizing,2000);
  setTimeout(fixSizing,4000);
});

// ── Marker events ───────────────────────────────────────────────────
document.querySelector('a-scene').addEventListener('loaded',()=>{
  dbg('AR.js loaded — show marker to camera');
  const marker=document.getElementById('marker');
  marker.addEventListener('markerFound',()=>{
    statusEl.textContent='MARKER FOUND ✓';
    statusEl.classList.add('found');
    dbg('✓ marker detected!');
  });
  marker.addEventListener('markerLost',()=>{
    statusEl.textContent='SEARCHING FOR MARKER';
    statusEl.classList.remove('found');
    dbg('marker lost — keep searching');
  });
});
</script>
</body>
</html>
