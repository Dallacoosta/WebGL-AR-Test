<script>
const marker = document.getElementById('marker');
const cube = document.getElementById('cube');

const statusEl = document.getElementById('status');

let devices = [];
let currentCamera = 0;
let stream = null;

// --------------------------------------------------
// ROTATING CUBE
// --------------------------------------------------

let rot = 0;

function animateCube() {
  rot += 1;

  cube.setAttribute(
    'rotation',
    `${rot * 0.7} ${rot} ${rot * 0.3}`
  );

  requestAnimationFrame(animateCube);
}

animateCube();

// --------------------------------------------------
// MARKER EVENTS
// --------------------------------------------------

marker.addEventListener('markerFound', () => {
  console.log('marker found');

  statusEl.textContent = 'MARKER FOUND ✓';
  statusEl.classList.add('found');
});

marker.addEventListener('markerLost', () => {
  console.log('marker lost');

  statusEl.textContent = 'SEARCHING FOR MARKER';
  statusEl.classList.remove('found');
});

// --------------------------------------------------
// CAMERA ENUMERATION
// --------------------------------------------------

async function getCameras() {

  try {

    // request permission first
    await navigator.mediaDevices.getUserMedia({
      video: true
    });

    const allDevices =
      await navigator.mediaDevices.enumerateDevices();

    devices = allDevices.filter(
      d => d.kind === 'videoinput'
    );

    console.log('cameras:', devices);

  } catch (e) {

    console.error(e);

  }
}

// --------------------------------------------------
// SWITCH CAMERA
// --------------------------------------------------

async function switchCamera() {

  if (devices.length === 0) return;

  currentCamera =
    (currentCamera + 1) % devices.length;

  const deviceId =
    devices[currentCamera].deviceId;

  console.log(
    'switching to:',
    devices[currentCamera].label
  );

  // stop old stream
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: {
          exact: deviceId
        },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    // replace video stream manually
    const video = document.querySelector('video');

    if (video) {
      video.srcObject = stream;
      video.play();
    }

  } catch (e) {

    console.error(e);

  }
}

// --------------------------------------------------
// INIT
// --------------------------------------------------

document
  .getElementById('btn-launch')
  .addEventListener('click', async () => {

    document
      .getElementById('landing')
      .classList.add('hidden');

    document
      .getElementById('hud')
      .classList.add('visible');

    await getCameras();

  });

// --------------------------------------------------
// CAMERA SWITCH BUTTON
// --------------------------------------------------

const switchBtn = document.createElement('button');

switchBtn.innerText = 'SWITCH CAMERA';

switchBtn.style.position = 'fixed';
switchBtn.style.top = '20px';
switchBtn.style.right = '20px';
switchBtn.style.zIndex = '1000';
switchBtn.style.padding = '10px';
switchBtn.style.background = 'black';
switchBtn.style.color = 'white';
switchBtn.style.border = '1px solid cyan';

switchBtn.addEventListener('click', switchCamera);

document.body.appendChild(switchBtn);

</script>
