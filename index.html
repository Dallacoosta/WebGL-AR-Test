<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>CFD AR – Cube Test</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New', monospace; }

  video {
    position:fixed !important;
    top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) !important;
    min-width:100vw !important; min-height:100vh !important;
    width:auto !important; height:auto !important;
    z-index:0 !important;
  }
  canvas {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
    z-index:1 !important;
  }
  a-scene {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
  }

  /* Landing */
  #landing {
    position:fixed; inset:0; z-index:999;
    background:#030a14;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition:opacity 0.4s;
  }
  #landing.hidden { opacity:0; pointer-events:none; }
  #landing h1 { color:#00c8ff; font-size:2rem; letter-spacing:4px; }
  #landing p  { color:rgba(255,255,255,0.45); font-size:11px; letter-spacing:2px;
                text-align:center; max-width:300px; line-height:1.9; }
  #landing img { width:180px; height:180px; border:3px solid rgba(0,200,255,0.4); background:#fff; }
  #landing small { color:rgba(0,200,255,0.5); font-size:9px; letter-spacing:2px;
                   text-align:center; max-width:280px; line-height:1.8; }
  #btn-launch {
    background:transparent; border:1px solid #00c8ff; color:#00c8ff;
    font-family:inherit; font-size:11px; letter-spacing:3px;
    padding:14px 40px; cursor:pointer; text-transform:uppercase; margin-top:4px;
  }
  #btn-launch:hover { background:#00c8ff; color:#000; }

  /* HUD */
  #hud { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0; transition:opacity 0.4s; }
  #hud.visible { opacity:1; }

  #status {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); border:1px solid rgba(0,200,255,0.3);
    color:#00c8ff; font-size:9px; letter-spacing:3px; padding:6px 16px; white-space:nowrap;
  }
  #status.found { color:#00ff88; border-color:rgba(0,255,136,0.4); }

  #debug {
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); color:#ffcc00;
    font-size:9px; padding:5px 12px; border:1px solid rgba(255,200,0,0.3);
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }

  /* Zoom indicator — shows current zoom level briefly */
  #zoom-indicator {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:22px; letter-spacing:2px;
    padding:10px 22px; border-radius:4px;
    opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  #zoom-indicator.show { opacity:1; }

  #playbar {
    position:absolute; bottom:0; left:0; right:0; padding:16px 24px 36px;
    background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
    pointer-events:all; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #step-info { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.5); }
  #scrubber {
    width:100%; max-width:400px; -webkit-appearance:none;
    height:3px; background:rgba(255,255,255,0.15); outline:none; cursor:pointer;
  }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#00c8ff; border:2px solid #000; box-shadow:0 0 8px rgba(0,200,255,0.7);
  }
  #btn-row { display:flex; gap:10px; }
  .pb-btn {
    background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-family:inherit; font-size:9px; letter-spacing:2px;
    padding:8px 20px; cursor:pointer; text-transform:uppercase;
  }
  .pb-btn:hover  { border-color:#00c8ff; color:#00c8ff; }
  .pb-btn.active { border-color:#00c8ff; color:#00c8ff; background:rgba(0,200,255,0.1); }
</style>
</head>
<body>

<!-- AR.js owns the camera — no interception, no fighting -->
<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; logarithmicDepthBuffer: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false">

  <a-marker preset="hiro" id="marker"
    smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-box id="cube"
      position="0 0.5 0"
      width="1" height="1" depth="1"
      color="#ff0000" opacity="1">
    </a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- Landing -->
<div id="landing">
  <h1>AR · CUBE TEST</h1>
  <p>Point your camera at the Hiro marker.<br/>A red cube will appear on it.</p>
  <img src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/data/images/hiro.png"
       alt="Hiro marker"
       onerror="this.src='https://jeromeetienne.github.io/AR.js/data/images/hiro.png'"/>
  <small>Print this or display on another screen.<br/>Hold ~30 cm away in good light.<br/>Pinch to zoom once camera is open.</small>
  <button id="btn-launch">Open Camera</button>
</div>

<!-- HUD -->
<div id="hud">
  <div id="status">SEARCHING FOR MARKER</div>
  <div id="debug">loading AR.js...</div>
  <div id="zoom-indicator">1.0×</div>
  <div id="playbar">
    <div id="step-info">STEP 1 / 10</div>
    <input type="range" id="scrubber" min="0" max="9" value="0" step="1"/>
    <div id="btn-row">
      <button class="pb-btn" id="btn-prev">◀◀</button>
      <button class="pb-btn" id="btn-play">▶ PLAY</button>
      <button class="pb-btn" id="btn-next">▶▶</button>
    </div>
  </div>
</div>

<script>
// ── Debug ───────────────────────────────────────────────────────────
const debugEl = document.getElementById('debug');
function dbg(msg) { console.log('[AR]', msg); debugEl.textContent = msg; }

// ── Fix video/canvas sizing ─────────────────────────────────────────
function fixSizing() {
  document.querySelectorAll('video').forEach(v => {
    v.style.position  = 'fixed';
    v.style.top       = '50%';
    v.style.left      = '50%';
    v.style.transform = 'translate(-50%,-50%)';
    v.style.minWidth  = '100vw';
    v.style.minHeight = '100vh';
    v.style.width     = 'auto';
    v.style.height    = 'auto';
    v.style.zIndex    = '0';
  });
  document.querySelectorAll('canvas').forEach(c => {
    c.style.position='fixed'; c.style.top='0'; c.style.left='0';
    c.style.width='100vw'; c.style.height='100vh'; c.style.zIndex='1';
  });
  const sc = document.querySelector('a-scene');
  if (sc && sc.renderer) sc.renderer.setSize(window.innerWidth, window.innerHeight);
  const v = document.querySelector('video');
  if (v && v.videoWidth) dbg(`${v.videoWidth}×${v.videoHeight} | zoom ${currentZoom.toFixed(1)}×`);
}
window.addEventListener('resize', fixSizing);

// ── Pinch-to-zoom ───────────────────────────────────────────────────
// Two modes:
//   A) Hardware zoom via ImageCapture API (Chrome Android — sets actual camera zoom)
//   B) CSS scale fallback (all browsers — scales the video element visually)

let currentZoom   = 1.0;
let minZoom       = 1.0;
let maxZoom       = 5.0;
let videoTrack    = null;   // set once camera is running
let zoomTimer     = null;
const zoomIndicator = document.getElementById('zoom-indicator');

function showZoomIndicator(val) {
  zoomIndicator.textContent = val.toFixed(1) + '×';
  zoomIndicator.classList.add('show');
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(() => zoomIndicator.classList.remove('show'), 1200);
}

async function applyZoom(newZoom) {
  newZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
  currentZoom = newZoom;
  showZoomIndicator(currentZoom);

  // Try hardware zoom first (Chrome Android supports this)
  if (videoTrack && videoTrack.getCapabilities) {
    const caps = videoTrack.getCapabilities();
    if (caps.zoom) {
      const hwZoom = caps.zoom.min + (caps.zoom.max - caps.zoom.min) * ((currentZoom - 1) / (maxZoom - 1));
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: hwZoom }] });
        dbg(`hw zoom ${currentZoom.toFixed(1)}× (${hwZoom.toFixed(1)} hw)`);
        return;   // hardware zoom worked — no need for CSS fallback
      } catch(e) {}
    }
  }

  // CSS scale fallback — zooms the video element visually
  const video = document.querySelector('video');
  if (video) {
    video.style.transform = `translate(-50%,-50%) scale(${currentZoom})`;
    dbg(`css zoom ${currentZoom.toFixed(1)}×`);
  }
}

// Pinch gesture handler — attached to document so it works anywhere on screen
let pinchStartDist = null;
let pinchStartZoom = 1.0;

document.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartZoom = currentZoom;
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinchStartDist) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const scale = dist / pinchStartDist;
    applyZoom(pinchStartZoom * scale);
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchStartDist = null;
});

// Mouse wheel zoom (desktop)
document.addEventListener('wheel', e => {
  if (!document.getElementById('hud').classList.contains('visible')) return;
  const delta = e.deltaY > 0 ? -0.15 : 0.15;
  applyZoom(currentZoom + delta);
  e.preventDefault();
}, { passive: false });

// ── Grab video track once camera is running ─────────────────────────
function grabVideoTrack() {
  const video = document.querySelector('video');
  if (video && video.srcObject) {
    const tracks = video.srcObject.getVideoTracks();
    if (tracks.length > 0) {
      videoTrack = tracks[0];
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.zoom) {
        minZoom = 1.0;
        maxZoom = Math.max(5.0, caps.zoom.max / caps.zoom.min);
        dbg(`hw zoom available: max ${maxZoom.toFixed(1)}×`);
        // Start at minimum zoom (widest view)
        videoTrack.applyConstraints({ advanced:[{ zoom: caps.zoom.min }] }).catch(()=>{});
      } else {
        dbg('hw zoom not supported — using css zoom');
      }
      return true;
    }
  }
  return false;
}

// ── Playback ────────────────────────────────────────────────────────
const TOTAL  = 10;
const COLORS = ['#ff0000','#ff6600','#ffcc00','#00ff88','#00c8ff',
                 '#0044ff','#aa00ff','#ff00aa','#ffffff','#ff4400'];
let current=0, playing=false, timer=null;
const cube     = document.getElementById('cube');
const statusEl = document.getElementById('status');
const stepInfo = document.getElementById('step-info');
const scrubber = document.getElementById('scrubber');
const btnPlay  = document.getElementById('btn-play');

function showStep(idx) {
  current = Math.max(0, Math.min(TOTAL-1, idx));
  const angle = (current/TOTAL)*360;
  cube.setAttribute('rotation', `${angle*0.5} ${angle} ${angle*0.3}`);
  cube.setAttribute('color', COLORS[current]);
  scrubber.value = current;
  stepInfo.textContent = `STEP ${current+1}/${TOTAL} — ${Math.round(angle)}°`;
}
function startPlay(){ playing=true; btnPlay.textContent='⏸ PAUSE'; btnPlay.classList.add('active'); tick(); }
function stopPlay(){  playing=false; btnPlay.textContent='▶ PLAY';  btnPlay.classList.remove('active'); clearTimeout(timer); }
function tick(){ timer=setTimeout(()=>{ showStep((current+1)%TOTAL); if(playing)tick(); },400); }

btnPlay.addEventListener('click', ()=>playing?stopPlay():startPlay());
document.getElementById('btn-prev').addEventListener('click', ()=>{ stopPlay(); showStep(current-1); });
document.getElementById('btn-next').addEventListener('click', ()=>{ stopPlay(); showStep(current+1); });
scrubber.addEventListener('input', ()=>{ stopPlay(); showStep(+scrubber.value); });

// ── Launch ──────────────────────────────────────────────────────────
document.getElementById('btn-launch').addEventListener('click', () => {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('hud').classList.add('visible');
  showStep(0);
  setTimeout(fixSizing, 800);
  setTimeout(fixSizing, 2000);
  // Try to grab video track after camera starts
  setTimeout(() => { if (!grabVideoTrack()) setTimeout(grabVideoTrack, 2000); }, 1500);
});

// ── Marker events ───────────────────────────────────────────────────
document.querySelector('a-scene').addEventListener('loaded', () => {
  dbg('AR.js ready — show Hiro marker to camera');
  const marker = document.getElementById('marker');
  marker.addEventListener('markerFound', () => {
    statusEl.textContent = 'MARKER FOUND ✓';
    statusEl.classList.add('found');
    dbg('✓ MARKER DETECTED');
  });
  marker.addEventListener('markerLost', () => {
    statusEl.textContent = 'SEARCHING FOR MARKER';
    statusEl.classList.remove('found');
    dbg('marker lost — keep Hiro in frame');
  });
});
</script>
</body>
</html>
