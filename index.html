<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Test</title>
  <!-- Pinned to specific commit — never changes, never gets stale cache -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.3/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #log {
      position:fixed; top:0; left:0; right:0; z-index:9999;
      background:rgba(0,0,0,0.75); color:#ffcc00;
      font:11px monospace; padding:6px 10px; line-height:1.8;
      pointer-events:none;
    }
  </style>
</head>
<body>

<div id="log">starting...</div>

<a-scene
  id="scene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false">

  <a-marker preset="hiro" id="marker">
    <a-box position="0 0.5 0" color="red" scale="1 1 1"></a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const log = document.getElementById('log');
function msg(t) { log.innerHTML += '<br>' + t; console.log(t); }

document.getElementById('scene').addEventListener('loaded', () => {
  msg('scene loaded ✓');

  const canvas = document.querySelector('canvas');
  const video  = document.querySelector('video');
  msg('canvas z: ' + (canvas ? getComputedStyle(canvas).zIndex : 'none'));
  msg('video  z: ' + (video  ? getComputedStyle(video).zIndex  : 'none'));

  const scene = document.getElementById('scene');
  if (scene.renderer) {
    scene.renderer.setClearColor(0x000000, 0);
    msg('alpha forced ✓');
  }

  document.getElementById('marker').addEventListener('markerFound', () => msg('✓ MARKER FOUND — cube should show'));
  document.getElementById('marker').addEventListener('markerLost',  () => msg('marker lost'));
});
</script>
</body>
</html>
