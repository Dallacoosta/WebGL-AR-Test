<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>CFD AR – Cube Test</title>

<!-- A-Frame + AR.js EXACT version known to work with Hiro -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New', monospace; }

  video {
    position:fixed !important;
    top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) !important;
    min-width:100vw !important; min-height:100vh !important;
    width:auto !important; height:auto !important;
    z-index:0 !important;
  }
  canvas {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
    z-index:1 !important;
  }
  a-scene {
    position:fixed !important;
    top:0 !important; left:0 !important;
    width:100vw !important; height:100vh !important;
  }

  /* ── Landing ── */
  #landing {
    position:fixed; inset:0; z-index:999;
    background:#030a14;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    transition:opacity 0.4s;
  }
  #landing.hidden { opacity:0; pointer-events:none; }
  #landing h1 { color:#00c8ff; font-size:2rem; letter-spacing:4px; }
  #landing p  { color:rgba(255,255,255,0.45); font-size:11px; letter-spacing:2px;
                text-align:center; max-width:300px; line-height:1.9; }
  #landing small { color:rgba(0,200,255,0.5); font-size:9px; letter-spacing:2px; text-align:center; max-width:280px; line-height:1.8; }
  #btn-launch {
    background:transparent; border:1px solid #00c8ff; color:#00c8ff;
    font-family:inherit; font-size:11px; letter-spacing:3px;
    padding:14px 40px; cursor:pointer; text-transform:uppercase; margin-top:8px;
  }
  #btn-launch:hover { background:#00c8ff; color:#000; }

  /* Official Hiro marker image */
  #hiro-img {
    width:180px; height:180px;
    border:3px solid rgba(0,200,255,0.4);
    image-rendering:pixelated;
  }

  /* ── HUD ── */
  #hud { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0; transition:opacity 0.4s; }
  #hud.visible { opacity:1; }

  #status {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); border:1px solid rgba(0,200,255,0.3);
    color:#00c8ff; font-size:9px; letter-spacing:3px; padding:6px 16px; white-space:nowrap;
  }
  #status.found { color:#00ff88; border-color:rgba(0,255,136,0.4); }

  #debug {
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); color:#ffcc00;
    font-size:9px; letter-spacing:1px; padding:5px 12px;
    border:1px solid rgba(255,200,0,0.3); white-space:nowrap; max-width:90vw;
    overflow:hidden; text-overflow:ellipsis;
  }

  /* Camera switcher button — top right */
  #btn-cam {
    position:absolute; top:14px; right:16px;
    background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-family:inherit; font-size:9px; letter-spacing:2px;
    padding:7px 14px; cursor:pointer; text-transform:uppercase;
    pointer-events:all;
    transition:border-color .2s;
  }
  #btn-cam:hover { border-color:#00c8ff; color:#00c8ff; }

  #playbar {
    position:absolute; bottom:0; left:0; right:0; padding:16px 24px 36px;
    background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
    pointer-events:all; display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #step-info { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.5); }
  #scrubber {
    width:100%; max-width:400px; -webkit-appearance:none;
    height:3px; background:rgba(255,255,255,0.15); outline:none; cursor:pointer;
  }
  #scrubber::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#00c8ff; border:2px solid #000; box-shadow:0 0 8px rgba(0,200,255,0.7);
  }
  #btn-row { display:flex; gap:10px; }
  .pb-btn {
    background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-family:inherit; font-size:9px; letter-spacing:2px;
    padding:8px 20px; cursor:pointer; text-transform:uppercase;
  }
  .pb-btn:hover  { border-color:#00c8ff; color:#00c8ff; }
  .pb-btn.active { border-color:#00c8ff; color:#00c8ff; background:rgba(0,200,255,0.1); }
</style>
</head>
<body>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; logarithmicDepthBuffer: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false">

  <a-marker preset="hiro" id="marker"
    smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-box id="cube"
      position="0 0.5 0"
      width="1" height="1" depth="1"
      color="#ff0000"
      opacity="1">
    </a-box>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- Landing -->
<div id="landing">
  <h1>AR · CUBE TEST</h1>
  <p>Point your camera at the Hiro marker.<br/>A red cube will appear on it.</p>

  <!-- Hiro marker fetched from the one CDN that serves it correctly -->
  <img id="hiro-img"
    src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/data/images/hiro.png"
    alt="Hiro marker"
    onerror="this.src='https://raw.githack.com/jeromeetienne/AR.js/master/data/images/hiro.png'"/>

  <small>
    Print this marker or open it on a second screen.<br/>
    Hold it flat, in good light, ~30 cm from camera.
  </small>
  <button id="btn-launch">Open Camera</button>
</div>

<!-- HUD -->
<div id="hud">
  <div id="status">SEARCHING FOR MARKER</div>
  <div id="debug">starting...</div>
  <button id="btn-cam">⟳ CAM</button>
  <div id="playbar">
    <div id="step-info">STEP 1 / 10</div>
    <input type="range" id="scrubber" min="0" max="9" value="0" step="1"/>
    <div id="btn-row">
      <button class="pb-btn" id="btn-prev">◀◀</button>
      <button class="pb-btn" id="btn-play">▶ PLAY</button>
      <button class="pb-btn" id="btn-next">▶▶</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CAMERA MANAGER
// ═══════════════════════════════════════════════════════
let allCameras   = [];   // all videoinput devices
let camIndex     = 0;    // which one is active
let activeStream = null;

async function enumerateCameras() {
  // Permission needed first before labels are available
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
    tmp.getTracks().forEach(t => t.stop());
  } catch(e) {}

  const devices = await navigator.mediaDevices.enumerateDevices();
  allCameras = devices.filter(d => d.kind === 'videoinput');
  dbg(`${allCameras.length} camera(s) found`);

  // Sort: put rear cameras first
  allCameras.sort((a, b) => {
    const la = (a.label||'').toLowerCase();
    const lb = (b.label||'').toLowerCase();
    const aRear = la.includes('back')||la.includes('rear')||la.includes('environment');
    const bRear = lb.includes('back')||lb.includes('rear')||lb.includes('environment');
    return bRear - aRear;
  });

  allCameras.forEach((c,i) => dbg(`cam ${i}: ${c.label.slice(0,40)||'(no label)'}`));
}

async function openCamera(index) {
  // Stop existing stream
  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }

  const device = allCameras[index];
  if (!device) { dbg('no camera at index '+index); return null; }

  dbg(`opening cam ${index}: ${(device.label||'cam').slice(0,30)}`);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        deviceId: { exact: device.deviceId },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });

    // Apply minimum zoom if supported
    const track = stream.getVideoTracks()[0];
    if (track.getCapabilities) {
      const caps = track.getCapabilities();
      if (caps.zoom) {
        await track.applyConstraints({ advanced:[{ zoom: caps.zoom.min }] }).catch(()=>{});
        dbg(`cam ${index} zoom min=${caps.zoom.min}`);
      }
    }

    activeStream = stream;

    // Inject stream into the AR.js video element
    const video = document.querySelector('video');
    if (video) {
      video.srcObject = stream;
      video.play().catch(()=>{});
    }

    fixSizing();
    return stream;

  } catch(e) {
    dbg(`cam ${index} error: ${e.message.slice(0,40)}`);
    return null;
  }
}

async function switchCamera() {
  if (allCameras.length === 0) { dbg('no cameras enumerated yet'); return; }
  camIndex = (camIndex + 1) % allCameras.length;
  dbg(`switching to cam ${camIndex}...`);
  await openCamera(camIndex);
}

// Intercept getUserMedia — AR.js will call this; we return our managed stream
const _gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = async function(constraints) {
  // Only intercept video requests
  if (constraints && constraints.video) {
    // If we already have a stream, return it
    if (activeStream) return activeStream;
    // Otherwise let AR.js handle first init, we'll swap after enumeration
    return _gum({
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }
    });
  }
  return _gum(constraints);
};

// ═══════════════════════════════════════════════════════
// DEBUG
// ═══════════════════════════════════════════════════════
const debugEl = document.getElementById('debug');
function dbg(msg) {
  console.log('[AR]', msg);
  debugEl.textContent = msg;
}

// ═══════════════════════════════════════════════════════
// SIZING
// ═══════════════════════════════════════════════════════
function fixSizing() {
  document.querySelectorAll('video').forEach(v => {
    v.style.position  = 'fixed';
    v.style.top       = '50%';
    v.style.left      = '50%';
    v.style.transform = 'translate(-50%,-50%)';
    v.style.minWidth  = '100vw';
    v.style.minHeight = '100vh';
    v.style.width     = 'auto';
    v.style.height    = 'auto';
    v.style.zIndex    = '0';
  });
  document.querySelectorAll('canvas').forEach(c => {
    c.style.position = 'fixed'; c.style.top = '0'; c.style.left = '0';
    c.style.width = '100vw'; c.style.height = '100vh'; c.style.zIndex = '1';
  });
  const sc = document.querySelector('a-scene');
  if (sc && sc.renderer) sc.renderer.setSize(window.innerWidth, window.innerHeight);

  const v = document.querySelector('video');
  if (v && v.videoWidth) dbg(`video ${v.videoWidth}×${v.videoHeight}`);
}
window.addEventListener('resize', fixSizing);

// ═══════════════════════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════════════════════
const TOTAL  = 10;
const COLORS = ['#ff0000','#ff6600','#ffcc00','#00ff88','#00c8ff',
                 '#0044ff','#aa00ff','#ff00aa','#ffffff','#ff4400'];
let current=0, playing=false, timer=null;
const cube     = document.getElementById('cube');
const statusEl = document.getElementById('status');
const stepInfo = document.getElementById('step-info');
const scrubber = document.getElementById('scrubber');
const btnPlay  = document.getElementById('btn-play');

function showStep(idx) {
  current = Math.max(0, Math.min(TOTAL-1, idx));
  const angle = (current / TOTAL) * 360;
  cube.setAttribute('rotation', `${angle*0.5} ${angle} ${angle*0.3}`);
  cube.setAttribute('color', COLORS[current]);
  scrubber.value = current;
  stepInfo.textContent = `STEP ${current+1}/${TOTAL} — ${Math.round(angle)}°`;
}
function startPlay(){ playing=true; btnPlay.textContent='⏸ PAUSE'; btnPlay.classList.add('active'); tick(); }
function stopPlay(){  playing=false; btnPlay.textContent='▶ PLAY';  btnPlay.classList.remove('active'); clearTimeout(timer); }
function tick(){ timer=setTimeout(()=>{ showStep((current+1)%TOTAL); if(playing)tick(); }, 400); }

btnPlay.addEventListener('click', ()=>playing?stopPlay():startPlay());
document.getElementById('btn-prev').addEventListener('click', ()=>{ stopPlay(); showStep(current-1); });
document.getElementById('btn-next').addEventListener('click', ()=>{ stopPlay(); showStep(current+1); });
scrubber.addEventListener('input', ()=>{ stopPlay(); showStep(+scrubber.value); });
document.getElementById('btn-cam').addEventListener('click', switchCamera);

// ═══════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════
document.getElementById('btn-launch').addEventListener('click', async () => {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('hud').classList.add('visible');
  showStep(0);

  // Enumerate cameras, then open the first rear one
  await enumerateCameras();
  if (allCameras.length > 0) {
    camIndex = 0;
    await openCamera(camIndex);
  }

  setTimeout(fixSizing, 800);
  setTimeout(fixSizing, 2000);
});

// ═══════════════════════════════════════════════════════
// MARKER EVENTS
// ═══════════════════════════════════════════════════════
document.querySelector('a-scene').addEventListener('loaded', () => {
  dbg('AR.js ready — point at Hiro marker');
  const marker = document.getElementById('marker');
  marker.addEventListener('markerFound', () => {
    statusEl.textContent = 'MARKER FOUND ✓';
    statusEl.classList.add('found');
    dbg('✓ MARKER DETECTED');
  });
  marker.addEventListener('markerLost', () => {
    statusEl.textContent = 'SEARCHING FOR MARKER';
    statusEl.classList.remove('found');
    dbg('marker lost — keep trying');
  });
});
</script>
</body>
</html>
