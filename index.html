<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Test</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    #log {
      position:fixed; top:0; left:0; right:0; z-index:9999;
      background:rgba(0,0,0,0.85); color:#ffcc00;
      font:12px monospace; padding:8px 10px; line-height:2;
      pointer-events:none;
    }
  </style>
</head>
<body>
<div id="log">trying CDNs...</div>
<script>
const log = document.getElementById('log');
function msg(t) { log.innerHTML += '<br>' + t; console.log(t); }

// Try each CDN in order until one works
const AFRAME_URLS = [
  'https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js',
  'https://unpkg.com/aframe@1.3.0/dist/aframe.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/aframe/1.3.0/aframe.min.js',
  'https://aframe.io/releases/1.3.0/aframe.min.js',
];

const ARJS_URLS = [
  'https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.js',
  'https://raw.githack.com/AR-js-org/AR.js/3.3.3/aframe/build/aframe-ar.js',
  'https://unpkg.com/ar.js@2.2.2/aframe/build/aframe-ar.js',
];

function tryLoad(urls, label, onSuccess) {
  const url = urls.shift();
  if (!url) { msg(label + ': ALL CDNs FAILED ✗'); return; }
  msg('trying: ' + url.split('/').slice(2,4).join('/') + '...');
  const s = document.createElement('script');
  s.src = url;
  s.onload  = () => { msg(label + ' loaded from ' + url.split('/').slice(2,4).join('/') + ' ✓'); onSuccess(); };
  s.onerror = () => { msg('failed, next...'); tryLoad(urls, label, onSuccess); };
  document.head.appendChild(s);
}

tryLoad([...AFRAME_URLS], 'A-Frame', () => {
  tryLoad([...ARJS_URLS], 'AR.js', () => {
    msg('both loaded — building scene...');
    buildScene();
  });
});

function buildScene() {
  document.body.insertAdjacentHTML('beforeend', `
    <a-scene id="scene" embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false">
      <a-marker preset="hiro" id="marker">
        <a-box position="0 0.5 0" color="red"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  `);

  const scene = document.getElementById('scene');
  scene.addEventListener('loaded', () => {
    msg('scene loaded ✓ — POINT AT HIRO MARKER');
    if (scene.renderer) scene.renderer.setClearColor(0x000000, 0);
    document.getElementById('marker').addEventListener('markerFound', () => msg('🟢 MARKER FOUND — cube visible!'));
    document.getElementById('marker').addEventListener('markerLost',  () => msg('marker lost'));
  });

  setTimeout(() => {
    if (!document.querySelector('canvas')) msg('TIMEOUT — scene never initialised');
  }, 10000);
}
</script>
</body>
</html>
